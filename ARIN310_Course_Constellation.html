  <div class="row"><button class="btn" data-act="export">Export progress</button><button class="btn" data-act="import">Import progress</button><span class="sp"></span><button class="btn" data-act="reset" id="resetBtn">Reset</button></div></div>`}
function viewUnit(i){const u=U[i];
  setBody('Unit '+(i+1),`${badge(i)}<h2>${esc(short(i))}</h2>${blocks(u.intro)}
  <p class="muted">${unitDone(i)} of ${u.concepts.length} concepts reviewed · quiz ${quizScore(i)}/${u.quiz.length}</p>
  <div class="list">${u.concepts.map((c,j)=>`<button class="item ${state.reviewed[c.id]?'done':''}" data-go="concept:${c.id}"><span class="dot" style="--c:${COLORS[i]}"></span><span><span class="t">${esc(c.title)}</span>${NB.has(c.id)?`<span class="s">Connects to ${NB.get(c.id).map(x=>'Unit '+(conceptById[x.id].i+1)).filter((v,k,a)=>a.indexOf(v)===k).join(', ')}</span>`:''}</span></button>`).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn primary" data-go="quiz:${i}">Take the Unit ${i+1} quiz</button>${i<7?`<button class="btn" data-go="unit:${i+1}">Unit ${i+2}</button>`:''}</div>`)}
function viewConcept(id){const {c,i,j}=conceptById[id];const nb=NB.get(id)||[];const th=THREADS_OF.get(id)||[];
  setBody(`Unit ${i+1} · Concept ${j+1} of ${U[i].concepts.length}`,`${badge(i)}<h2>${esc(c.title)}</h2>${blocks(c.blocks)}
  ${nb.length?`<h3>Connected ideas</h3><div class="list">${nb.map(x=>{const o=conceptById[x.id];return `<button class="item" data-go="concept:${x.id}"><span class="dot" style="--c:${COLORS[o.i]}"></span><span><span class="t">Unit ${o.i+1}: ${esc(o.c.title)}</span><span class="s">${esc(x.r)}</span></span></button>`}).join('')}</div>`:''}
  ${th.length?`<h3>On these threads</h3><div class="row">${th.map(ti=>`<button class="tag" data-go="thread:${ti}:${THREADS[ti].steps.findIndex(s=>s[0]===id)}">${esc(THREADS[ti].title)}</button>`).join('')}</div>`:''}
  <div class="box"><h3>Explain it back</h3><p class="muted">Put this idea in your own words. Add an example from your work, and one question you would ask before trusting a system that uses it.</p>
  <label for="note" class="muted">Your notes, saved in this browser</label><textarea id="note">${esc(state.notes[id]||'')}</textarea></div>
  <div class="row"><button class="btn ${state.reviewed[id]?'':'primary'}" data-act="mark" data-id="${id}" id="markBtn">${state.reviewed[id]?'Reviewed ✓ (undo)':'Mark as reviewed'}</button><span class="sp"></span>
  ${j>0?`<button class="btn" data-go="concept:${U[i].concepts[j-1].id}">Previous</button>`:''}
  ${j+1<U[i].concepts.length?`<button class="btn" data-go="concept:${U[i].concepts[j+1].id}">Next concept</button>`:`<button class="btn" data-go="quiz:${i}">Unit quiz</button>`}</div>`);
  $('note').addEventListener('input',e=>{state.notes[id]=e.target.value;clearTimeout(viewConcept.t);viewConcept.t=setTimeout(save,400)})}
function viewQuiz(i){const u=U[i];
  setBody('Unit '+(i+1)+' · Quiz',`${badge(i)}<h2>Check Unit ${i+1}</h2><p class="muted">Pick an answer to see feedback. You can change your answer.</p>
  ${u.quiz.map((q,j)=>{const a=state.answers[i+'-'+j];return `<div class="box"><h3>${j+1}. ${esc(q[0])}</h3><div class="answers">${q[1].map((t,k)=>`<button data-act="ans" data-i="${i}" data-j="${j}" data-k="${k}" class="${a===k?(k===q[2]?'right':'wrong'):''}" aria-pressed="${a===k}">${esc(t)}</button>`).join('')}</div>
  ${a!==undefined?`<div class="fb"><strong>${a===q[2]?'Correct.':'Not quite.'}</strong> ${esc(q[3])}</div>`:''}</div>`}).join('')}
  <div class="row"><button class="btn" data-go="unit:${i}">Back to Unit ${i+1}</button>${i<7?`<button class="btn primary" data-go="unit:${i+1}">On to Unit ${i+2}</button>`:''}</div>`)}
function viewThreads(){setBody('Threads',`<h2>Threads through the course</h2><p class="lede">Some ideas show up again and again. Each thread is a tour: the map flies to each stop and draws the route between them.</p>
  <div class="list">${THREADS.map((t,ti)=>`<button class="item" data-go="thread:${ti}:0"><span class="dot" style="--c:#ffffff"></span><span><span class="t">${esc(t.title)}</span><span class="s">${esc(t.lede)}</span></span></button>`).join('')}</div>`)}
function viewThread(){const t=THREADS[thread],[id,note]=t.steps[step],o=conceptById[id];
  setBody(`Thread · Stop ${step+1} of ${t.steps.length}`,`<h2>${esc(t.title)}</h2><p class="lede">${esc(t.lede)}</p>
  ${badge(o.i)}<p class="note" style="--c:${COLORS[o.i]}">${esc(note)}</p>
  <div class="row"><button class="btn" ${step?'':'disabled'} data-go="thread:${thread}:${step-1}">Previous stop</button>${step+1<t.steps.length?`<button class="btn primary" data-go="thread:${thread}:${step+1}">Next stop</button>`:`<button class="btn primary" data-go="threads">All threads</button>`}<span class="sp"></span><button class="btn" data-go="concept:${id}">Read the concept</button></div>
  <h3>The route</h3><div class="list">${t.steps.map(([sid,n],m)=>{const so=conceptById[sid];return `<button class="item ${m===step?'cur':''}" data-go="thread:${thread}:${m}"><span class="dot" style="--c:${COLORS[so.i]}"></span><span><span class="t">${m+1}. ${esc(so.c.title)}</span><span class="s">Unit ${so.i+1}</span></span></button>`}).join('')}</div>`)}
function viewGloss(f){const rows=DATA.glossary.slice(1).filter(r=>!f||r.join(' ').toLowerCase().includes(f));
  setBody('Glossary',`<h2>Glossary</h2><label for="gf" class="muted">Filter terms</label><input class="gfilter" id="gf" type="search" value="${esc(f)}" placeholder="Type a term">
  <div class="tablewrap"><table><thead><tr><th scope="col">Term</th><th scope="col">Meaning</th><th scope="col">Unit</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="white-space:normal"><strong>${esc(r[0])}</strong></td><td>${esc(r[1])}</td><td>${r[2].split(', ').map(u=>`<button class="tag" data-go="unit:${+u-1}">${u}</button>`).join(' ')}</td></tr>`).join('')||'<tr><td colspan="3">No terms match.</td></tr>'}</tbody></table></div>`);
  const g=$('gf');g.addEventListener('input',()=>{const v=g.value.toLowerCase();viewGloss(v);const n=$('gf');n.focus();n.setSelectionRange(n.value.length,n.value.length)})}
function viewSearch(){const hits=nodes.filter(n=>FOCUS&&FOCUS.has(n.id));
  setBody('Search',`<h2>${hits.length} match${hits.length===1?'':'es'}</h2><p class="muted">For “${esc(query)}”. Matching stars stay lit on the map.</p>
  <div class="list">${hits.map(n=>n.kind==='unit'?`<button class="item" data-go="unit:${n.unit}"><span class="dot" style="--c:${n.color}"></span><span><span class="t">${esc(n.label)}</span></span></button>`
    :`<button class="item ${state.reviewed[n.id]?'done':''}" data-go="concept:${n.id}"><span class="dot" style="--c:${n.color}"></span><span><span class="t">${esc(n.label)}</span><span class="s">Unit ${n.unit+1}: ${esc(short(n.unit))}</span></span></button>`).join('')}</div>`)}

/* Delegated clicks for everything in the panel */
let resetArmed=false;
$('dbody').addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-act]');if(!b||b.disabled)return;
  if(b.dataset.go){go(b.dataset.go);return}
  const a=b.dataset.act;
  if(a==='mark'){const id=b.dataset.id;state.reviewed[id]=!state.reviewed[id];save();b.textContent=state.reviewed[id]?'Reviewed ✓ (undo)':'Mark as reviewed';b.classList.toggle('primary',!state.reviewed[id]);if(state.reviewed[id])toast('Marked reviewed')}
  else if(a==='ans'){state.answers[b.dataset.i+'-'+b.dataset.j]=+b.dataset.k;save();const y=$('dbody').scrollTop;viewQuiz(+b.dataset.i);$('dbody').scrollTop=y}
  else if(a==='export'){const blob=new Blob([JSON.stringify({course:'ARIN310',version:1,savedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),l=document.createElement('a');l.href=url;l.download='ARIN310-review-progress.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Progress file saved')}
  else if(a==='import'){$('file').click()}
  else if(a==='reset'){if(!resetArmed){resetArmed=true;b.textContent='Click again to erase all progress';setTimeout(()=>{resetArmed=false;if(document.body.contains(b))b.textContent='Reset'},4000)}else{resetArmed=false;state={reviewed:{},notes:{},answers:{}};save();viewOverview();toast('Progress cleared')}}});
$('file').addEventListener('change',async()=>{try{const f=$('file').files[0];if(!f)return;const p=JSON.parse(await f.text());if(p.course!=='ARIN310'||!p.state)throw 0;const s=p.state,v={reviewed:{},notes:{},answers:{}};
  U.forEach((u,i)=>{u.concepts.forEach(c=>{if(s.reviewed&&s.reviewed[c.id]===true)v.reviewed[c.id]=true;if(s.notes&&typeof s.notes[c.id]==='string')v.notes[c.id]=s.notes[c.id]});u.quiz.forEach((q,j)=>{const x=s.answers&&s.answers[i+'-'+j];if(Number.isInteger(x)&&x>=0&&x<q[1].length)v.answers[i+'-'+j]=x})});
  state=v;save();go('overview',false);toast('Progress imported')}catch(e){toast('That file is not an ARIN 310 progress file.')}finally{$('file').value=''}});

/* Top bar and legend */
$('legend').innerHTML='<span class="cap">Units · bottom to top</span>'+U.map((u,i)=>`<button class="chip" data-u="${i}" style="--c:${COLORS[i]}"><span class="dot"></span><span>${i+1}</span><span class="nm">${esc(short(i).split(',')[0].replace(/ and .*/,''))}</span><span class="n"></span></button>`).join('');
$('legend').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)go('unit:'+b.dataset.u)});
$('bHelp').onclick=()=>go('help');$('bOverview').onclick=()=>go('overview');$('bThreads').onclick=()=>go('threads');$('bGloss').onclick=()=>go('gloss');
$('bHome').onclick=()=>{flyHome();lastUser=0};
$('bLinks').onclick=e=>{showLinks=!showLinks;e.currentTarget.setAttribute('aria-pressed',showLinks);dirty=true};
let qt;$('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{query=e.target.value.trim().toLowerCase();if(query){sel=null;thread=null;recompute();if(route!=='search')stack.push(route);route='search';openDrawer();viewSearch();$('back').hidden=!stack.length}else{recompute();go('overview',false)}},180)});

layout();updateProgress();
let seen=false;try{seen=localStorage.getItem('arin310-seen-help')==='1';localStorage.setItem('arin310-seen-help','1')}catch(e){}
if(!seen)go('help',false);else if(W<=760){route='overview';viewOverview();closeDrawer()}else go('overview',false);
if(document.fonts)document.fonts.ready.then(()=>dirty=true);
requestAnimationFrame(tick);
</script>
</body>
</html>
