<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARIN 310 Course Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one full-screen 3D star chart. Height = position in the course. Panels float over it; nothing splits the view. */
:root{
  --ink:#0a1120; --ink-2:#0f1a2e; --panel:#111c31; --panel-2:#17253f; --line:#28395a;
  --fg:#e9eff8; --muted:#9db0c9; --accent:#7cc4ff; --good:#5fd3a8; --warn:#ffb86b;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font:16px/1.55 var(--body);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:radial-gradient(ellipse at 50% 55%,#13213b 0%,var(--ink) 70%)}
#stage.dragging{cursor:grabbing}
#stage.over{cursor:pointer}

/* Top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;
  padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,rgba(10,17,32,.96) 55%,rgba(10,17,32,0));pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:6px}
.eyebrow{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:2px 0 0;font:700 22px/1.1 var(--display);letter-spacing:-.01em}
.search{flex:1 1 220px;max-width:340px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 34px;color:var(--fg)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:#3a5078}
.btn[aria-pressed="true"]{background:#1d3352;border-color:var(--accent);color:#d6ecff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#08213a;font-weight:700}
.btn.primary:hover{background:#9ad2ff}
.prog{display:flex;align-items:center;gap:8px;margin-left:auto;font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{width:110px;height:6px;border-radius:9px;background:var(--panel-2);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--good);transition:width .3s}

/* Unit index */
.legend{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;flex-direction:column-reverse;gap:4px;max-width:250px}
.legend .cap{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0}
.chip{display:flex;align-items:center;gap:8px;background:rgba(17,28,49,.82);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;text-align:left;color:var(--fg);backdrop-filter:blur(6px)}
.chip:hover{border-color:#41587f}
.chip.on{border-color:var(--c);background:rgba(29,51,82,.9)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 8px var(--c)}
.chip .n{font:500 11px var(--mono);color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.hint{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8;font:500 11px var(--mono);color:var(--muted);letter-spacing:.04em;pointer-events:none;text-align:right}

/* Drawer */
.drawer{position:fixed;z-index:12;top:calc(76px + env(safe-area-inset-top,0px));right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 32px));
  display:flex;flex-direction:column;background:rgba(14,23,41,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.45);backdrop-filter:blur(10px);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.drawer.closed{transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none}
.dhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dhead .eyebrow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{background:none;border:1px solid transparent;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);font-size:20px;line-height:1}
.icon:hover{border-color:var(--line);color:var(--fg)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--fg)}
.dbody{overflow:auto;padding:18px 20px 26px;flex:1;min-height:0}
.dbody h2{font:700 26px/1.15 var(--display);margin:4px 0 10px;text-wrap:balance;letter-spacing:-.01em}
.dbody h3{font:700 17px/1.3 var(--display);margin:22px 0 8px}
.dbody p{margin:0 0 12px;color:#d7e1ee}
.dbody .lede{color:var(--muted)}
.dbody .pts{margin:0 0 12px;padding-left:20px}
.dbody .pts li{margin:0 0 6px;color:#d7e1ee}
.ubadge{display:inline-flex;align-items:center;gap:7px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.tablewrap{overflow-x:auto;margin:6px 0 14px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--panel-2);font-weight:700;color:var(--fg)}
tr:last-child td{border-bottom:0}
td:first-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.item{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);width:100%}
.item:hover{border-color:#41587f;background:var(--panel-2)}
.item .dot{margin-top:6px}
.item .t{display:block;font-weight:700}
.item .s{display:block;font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.item.done .t::after{content:" ✓";color:var(--good)}
.item.cur{border-color:var(--accent);background:#152a45}
.key{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:4px 0 8px;color:#d7e1ee}
.key b{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding-top:3px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:16px 0}
.box h3{margin-top:0}
textarea{width:100%;min-height:96px;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--fg)}
.tag:hover{border-color:var(--accent)}
.note{border-left:3px solid var(--c,var(--accent));padding:4px 0 4px 12px;margin:8px 0 14px;font-size:17px;line-height:1.5;color:var(--fg)}
.answers{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.answers button{text-align:left;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--fg)}
.answers button:hover{border-color:#41587f}
.answers button.right{border-color:var(--good);background:#123527}
.answers button.wrong{border-color:var(--warn);background:#3a2a17}
.fb{margin-top:8px;font-size:14px;color:#d7e1ee}
.muted{color:var(--muted);font-size:14px}
.gfilter{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.fab{position:fixed;z-index:11;right:16px;top:calc(80px + env(safe-area-inset-top,0px))}

@media (max-width:760px){
  .top{gap:8px;padding-inline:12px}
  .brand .eyebrow{display:none}
  .brand h1{font-size:18px}
  .prog{margin-left:auto}
  .prog .bar{width:60px}
  .tools{order:4;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .tools .btn{font-size:13px;padding:6px 11px}
  .search{order:5;flex-basis:100%;max-width:none}
  .legend{left:0;right:0;bottom:auto;top:var(--legend-top,170px);flex-direction:row;overflow-x:auto;max-width:none;padding:0 16px;gap:6px;scrollbar-width:none}
  .legend .cap{display:none}
  .chip{flex:none;padding:4px 9px;font-size:12px}
  .chip .nm{display:none}
  .hint{display:none}
  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;height:56%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .drawer.closed{transform:translateY(calc(100% + 20px))}
  .fab{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.drawer,.toast,.prog .bar i{transition:none}}
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="3D map of ARIN 310. Units rise from foundations at the bottom to the future at the top. Concepts orbit each unit. Use the unit list and review panel to reach every item by keyboard. Arrow keys rotate, plus and minus zoom."></canvas>

<header class="top">
  <div class="brand"><span class="eyebrow">ARIN 310 · Course review</span><h1>Course Constellation</h1></div>
  <label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke-width="2"/><path d="M11 11l4 4" stroke-width="2"/></svg>
    <input id="q" type="search" placeholder="Find a concept, like overfitting" aria-label="Search concepts"></label>
  <div class="tools">
    <button class="btn" id="bHelp">How to use</button>
    <button class="btn" id="bOverview">Overview</button>
    <button class="btn" id="bThreads">Threads</button>
    <button class="btn" id="bGloss">Glossary</button>
    <button class="btn" id="bLinks" aria-pressed="true">Connections</button>
    <button class="btn" id="bHome">Reset view</button>
  </div>
  <div class="prog" aria-live="polite"><span id="progTxt">0/54</span><span class="bar"><i id="progBar"></i></span></div>
</header>

<nav class="legend" id="legend" aria-label="Units"></nav>
<div class="hint">Drag to orbit · Scroll to zoom · Click a star</div>

<aside class="drawer" id="drawer" aria-label="Review panel">
  <div class="dhead"><button class="ghost" id="back" hidden>Back</button><span class="eyebrow" id="crumb"></span><button class="icon" id="close" aria-label="Close panel">×</button></div>
  <div class="dbody" id="dbody"></div>
</aside>
<button class="btn primary fab" id="openPanel" hidden>Open panel</button>
<input id="file" type="file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
const DATA={"units": [{"title": "Unit 1: Background, Introduction, and Definition of AI", "concepts": [{"title": "What AI is", "blocks": [{"text": "Artificial intelligence is the field of building computer systems that perform tasks we normally associate with human judgment. Those tasks include recognizing images, understanding language, making predictions, and choosing actions. There is no single agreed definition. Most working definitions focus on behavior: a system counts as AI if it does something that would require intelligence if a person did it.", "list": false}, {"text": "Two older approaches shaped the field. Symbolic AI writes knowledge down as explicit rules: if the patient has a fever and a stiff neck, consider meningitis. Machine learning skips the hand-written rules and learns patterns from examples. Almost all modern AI is the second kind.", "list": false}], "id": "0-0"}, {"title": "Narrow AI vs. general AI", "blocks": [{"text": "Every AI system in use today is narrow AI. It does one kind of task, often very well, and nothing else. A chess engine that beats every human alive cannot read a stop sign. A model that spots tumors on scans cannot plan a supply route.", "list": false}, {"text": "Artificial general intelligence (AGI) describes a hypothetical system that could learn and perform any intellectual task a person can. It does not exist. Researchers disagree sharply on whether it is close, distant, or possible at all. When you hear claims about AGI, treat them as predictions, not facts.", "list": false}], "id": "0-1"}, {"title": "The Turing Test", "blocks": [{"text": "In 1950 Alan Turing asked whether machines can think, then replaced that question with a practical one. Put a person in conversation, by text, with a hidden human and a hidden machine. If the person cannot reliably tell which is which, the machine passes.", "list": false}, {"text": "The test is famous and flawed. It measures whether a machine can imitate human conversation, not whether it understands anything. Modern chatbots can fool many people in short conversations. That shows how good they are at producing human-like text. It says little about reasoning or understanding.", "list": false}], "id": "0-2"}, {"title": "A history of booms and winters", "blocks": [{"text": "AI did not grow steadily. It moved through cycles of excitement, overpromising, disappointment, and funding cuts. The cuts are called AI winters.", "list": false}, {"table": [["Year", "Event", "Why it mattered"], ["1950", "Turing publishes \"Computing Machinery and Intelligence\"", "Frames the question of machine intelligence"], ["1956", "Dartmouth Conference", "John McCarthy coins the term \"artificial intelligence\"; the field is born"], ["1958", "Rosenblatt's perceptron", "First learning machine modeled loosely on a neuron"], ["1966", "ELIZA chatbot", "Simple pattern matching convinced users it understood them"], ["1969", "Minsky and Papert's Perceptrons", "Shows single-layer perceptrons cannot learn some simple patterns; neural network research stalls"], ["1973", "Lighthill Report (UK)", "Criticizes AI's failure to deliver; funding is cut, starting the first AI winter"], ["1980s", "Expert systems boom", "Rule-based systems such as XCON save companies money; business invests heavily"], ["Late 1980s", "Second AI winter", "Expert systems prove brittle and costly to maintain; the market collapses"], ["1986", "Backpropagation popularized", "Gives multi-layer neural networks a practical way to learn"], ["1997", "Deep Blue beats Kasparov", "A rule-and-search system defeats the world chess champion"], ["2012", "AlexNet wins ImageNet", "Deep learning dramatically outperforms older methods at recognizing images"], ["2016", "AlphaGo beats Lee Sedol", "Deep learning plus reinforcement learning masters Go"], ["2017", "Transformer architecture", "The design behind today's large language models"], ["2022", "ChatGPT released", "GenAI reaches the general public"]]}, {"text": "Three forces ended the long stall and powered today's boom: far more data from the internet, far more computing power from graphics processors (GPUs), and better algorithms for training deep neural networks.", "list": false}, {"text": "The pattern is worth remembering. Each boom produced real progress and inflated promises. Each winter followed when the promises outran the results.", "list": false}], "id": "0-3"}], "intro": [], "quiz": [["An expert system applies hand-written rules. Is it AI?", ["Yes, symbolic AI", "Only if it learns from data", "No, AI must be a robot"], 0, "AI includes rule-based approaches; machine learning is one approach within AI."], ["What does the Turing Test directly assess?", ["Human-like conversational behavior", "Consciousness", "Accuracy on every task"], 0, "It tests whether a judge can distinguish machine and human conversation, not whether the machine understands."], ["What is an AI winter?", ["Reduced funding and interest after unmet promises", "A cold-weather robot test", "An annual model update"], 0, "The source describes cycles of inflated expectations followed by disappointment and funding cuts."]]}, {"title": "Unit 2: Machine Learning and Deep Learning", "concepts": [{"title": "How machine learning works", "blocks": [{"text": "Machine learning flips traditional programming around. In traditional programming, a person writes the rules and the computer applies them to data. In machine learning, the computer receives data, and often the correct answers, and works out the rules itself.", "list": false}, {"text": "Take a bank deciding whether to approve loans. A rule-based system says: approve if income is above $50,000 and credit score is above 700. A machine learning system studies thousands of past loans, what the applicants looked like, and which loans were repaid. It learns which combinations of factors predict repayment, including combinations no person thought to write down.", "list": false}, {"text": "The pieces have names:", "list": false}, {"text": "Features are the inputs: income, credit score, years at current job.", "list": true}, {"text": "Labels are the correct answers in the training data: repaid or defaulted.", "list": true}, {"text": "The model is the learned pattern that maps features to a prediction.", "list": true}, {"text": "Training is the process of adjusting the model until its predictions match the labels as closely as possible.", "list": true}], "id": "1-0"}, {"title": "The three types of learning", "blocks": [{"text": "Supervised learning trains on labeled examples. The model sees inputs paired with correct answers and learns to predict the answer for new inputs. It handles two kinds of problems. Classification predicts a category: spam or not spam, fraud or legitimate. Regression predicts a number: next month's sales, a house's price.", "list": false}, {"text": "Unsupervised learning has no labels. The model looks for structure on its own. Clustering is the most common use. A retailer might feed in purchase histories and discover five natural customer groups nobody defined in advance. Anomaly detection is another use: find the transactions that look unlike everything else.", "list": false}, {"text": "Reinforcement learning learns from rewards and penalties through trial and error. Unit 4 covers it in depth.", "list": false}], "id": "1-1"}, {"title": "Training, testing, and overfitting", "blocks": [{"text": "A model is only useful if it works on data it has never seen. So the data is split. The model learns from the training set. Its real performance is measured on a separate test set it never saw during training.", "list": false}, {"text": "The central danger is overfitting. An overfit model memorizes its training data, including the noise and accidents, instead of learning the general pattern. Think of a student who memorizes the practice exam answers. Perfect score on the practice test, failure on the real one. An overfit model shows high accuracy in training and poor accuracy in the real world.", "list": false}, {"text": "The opposite problem is underfitting: the model is too simple to capture the pattern at all.", "list": false}, {"text": "A model also inherits whatever is in its data. If a hiring model trains on ten years of decisions made by biased managers, it learns that bias and repeats it at scale. Amazon scrapped an experimental resume-screening tool for exactly this reason after it learned to downgrade resumes that mentioned women's organizations. The model did what it was trained to do. The data was the problem.", "list": false}], "id": "1-2"}, {"title": "Neural networks", "blocks": [{"text": "A neural network is a machine learning model built from layers of simple connected units, loosely inspired by neurons in the brain. Each unit takes in numbers, multiplies each one by a weight, adds them up, and passes the result forward. The weights are what the network learns.", "list": false}, {"text": "The perceptron from Unit 1 is a single unit of this kind. It can only draw a straight line between two categories. Stack many units into layers and the network can learn curved, complex boundaries.", "list": false}, {"text": "A network learns through a loop:", "list": false}, {"text": "Feed in a training example and get a prediction.", "list": true}, {"text": "Measure how wrong the prediction is. This measure is called the loss.", "list": true}, {"text": "Use backpropagation to work out how much each weight contributed to the error.", "list": true}, {"text": "Nudge every weight slightly in the direction that reduces the error. This is gradient descent.", "list": true}, {"text": "Repeat millions of times.", "list": true}, {"text": "Nobody programs the weights directly. They settle into useful values through repetition.", "list": false}], "id": "1-3"}, {"title": "Deep learning", "blocks": [{"text": "Deep learning is machine learning with neural networks that have many layers. It is a subset of machine learning, not a separate field. Some textbooks draw them as side-by-side categories. That picture is wrong. AI contains machine learning, and machine learning contains deep learning.", "list": false}, {"text": "The depth matters because each layer builds on the one before it. In an image model, early layers detect edges. Middle layers combine edges into shapes such as circles and corners. Later layers combine shapes into objects: an eye, a wheel, a face. Nobody tells the network to look for edges. It discovers that edges are useful on its own.", "list": false}, {"text": "Deep learning powers image recognition, speech recognition, translation, and every modern large language model. Its costs are real. It needs huge amounts of data and computing power. And its reasoning is hard to inspect. A network with billions of weights can give a correct answer without anyone being able to say exactly why. This is the black box problem, and it matters most in high-stakes uses such as medicine, lending, and criminal justice.", "list": false}], "id": "1-4"}], "intro": [], "quiz": [["A model predicts next month’s fuel demand as a number. Which task is this?", ["Clustering", "Regression", "Classification"], 1, "Regression predicts a numerical value; classification predicts a category."], ["Training accuracy is excellent, but performance on unseen data is poor. What is a likely problem?", ["Overfitting", "Perfect generalization", "Too much test data"], 0, "Overfitting captures training-specific patterns that do not generalize."], ["Where does deep learning belong?", ["Within machine learning, which is within AI", "Outside AI", "Parallel to AI with no overlap"], 0, "Deep learning uses multilayer neural networks and is a subset of machine learning."]]}, {"title": "Unit 3: Natural Language Processing and Generative AI", "concepts": [{"title": "What NLP is", "blocks": [{"text": "Natural language processing (NLP) is the branch of AI that works with human language, written or spoken. It is hard because language is ambiguous. \"I saw her duck\" can mean you watched her lower her head or you saw her pet bird. People resolve this from context without noticing. Computers have to be built to do it.", "list": false}], "id": "2-0"}, {"title": "Classic NLP tasks", "blocks": [{"text": "Before GenAI, NLP was mostly about analyzing text, not producing it. These tasks still run inside many systems you use every day.", "list": false}, {"text": "Tokenization splits text into units the computer can process: words, parts of words, or punctuation.", "list": true}, {"text": "Sentiment analysis decides whether text is positive, negative, or neutral. Companies run it on product reviews and social media posts to track customer opinion.", "list": true}, {"text": "Named entity recognition finds and labels names of people, organizations, places, and dates. It lets a system pull \"Bank of America\" and \"March 3\" out of a news story.", "list": true}, {"text": "Text classification sorts documents into categories: spam filtering, routing support tickets, flagging urgent messages.", "list": true}, {"text": "Machine translation converts text from one language to another.", "list": true}, {"text": "Speech recognition turns spoken audio into text. Text-to-speech does the reverse. Voice assistants chain both together.", "list": true}], "id": "2-1"}, {"title": "How computers represent words", "blocks": [{"text": "Computers work with numbers, so words have to become numbers. The breakthrough was the word embedding: each word becomes a long list of numbers, a point in a space with hundreds of dimensions. Words used in similar contexts end up close together. \"Soldier\" lands near \"sailor\" and \"marine.\" \"Banana\" lands far away.", "list": false}, {"text": "Embeddings capture relationships, not just similarity. In a well-trained embedding space, the direction from \"man\" to \"woman\" is roughly the same as the direction from \"king\" to \"queen.\" The model learned this purely from how words appear together in text.", "list": false}], "id": "2-2"}, {"title": "Transformers and attention", "blocks": [{"text": "The transformer, introduced in 2017, is the architecture behind every major large language model. Its key idea is attention. When the model processes a word, it looks at every other word in the passage and decides which ones matter most for understanding it.", "list": false}, {"text": "In \"The trophy didn't fit in the suitcase because it was too big,\" the word \"it\" has to refer to the trophy. Change \"big\" to \"small\" and \"it\" now refers to the suitcase. Attention lets the model weigh those connections across the whole sentence at once, instead of reading one word at a time.", "list": false}], "id": "2-3"}, {"title": "How large language models are built", "blocks": [{"text": "A large language model (LLM) such as GPT, Claude, Gemini, or Copilot's underlying model is built in stages.", "list": false}, {"text": "Pretraining. The model reads an enormous amount of text: books, websites, articles, code. Its only task is to predict the next token. Given \"The capital of France is,\" it learns that \"Paris\" is very likely. Repeated across trillions of tokens, this simple task forces the model to absorb grammar, facts, writing styles, and patterns of reasoning.", "list": true}, {"text": "Fine-tuning. The pretrained model is trained further on examples of helpful question-and-answer exchanges, so it behaves like an assistant instead of just continuing text.", "list": true}, {"text": "Reinforcement learning from human feedback (RLHF). People rate or rank the model's responses. The model is trained to produce the kinds of answers people rated higher.", "list": true}, {"text": "When you type a prompt, the model generates its reply one token at a time. At each step it calculates the probability of every possible next token, picks one, adds it to the text, and repeats.", "list": false}], "id": "2-4"}, {"title": "Why LLMs make things up", "blocks": [{"text": "An LLM does not look up facts. It does not search the internet unless a separate search tool is attached. It produces the most probable continuation of the text. Most of the time, probable and true line up. When they do not, the model produces a hallucination: confident, fluent, and false.", "list": false}, {"text": "Citations are the classic example. Ask for sources and the model may produce a reference with authors, a year, a journal, and a page range. It looks exactly right because the model has seen millions of real citations. The paper may not exist. Lawyers have been sanctioned by courts for filing briefs that cited cases a chatbot invented.", "list": false}, {"text": "No prompt eliminates this. Better models hallucinate less, and attaching search or a document library helps, but the underlying mechanism is still prediction. A confident tone tells you nothing about accuracy. Verification is the user's job.", "list": false}], "id": "2-5"}, {"title": "NLP vs. GenAI", "blocks": [{"text": "The two overlap but are not the same thing.", "list": false}, {"table": [["", "Classic NLP", "Generative AI"], ["Main job", "Analyze existing language", "Produce new content"], ["Typical output", "A label, a score, an extracted name", "Paragraphs, images, code, audio"], ["Example", "Flag a review as negative", "Draft a reply to the review"], ["Main risk", "Misclassification", "Fluent but false output"]]}, {"text": "Generative AI also reaches beyond text. Image generators such as DALL-E and Midjourney commonly use diffusion models. They learn to turn random noise step by step into an image that matches a text description. The same core idea holds: the model learned statistical patterns from training data and produces something that fits them.", "list": false}], "id": "2-6"}], "intro": [], "quiz": [["What is tokenization?", ["Dividing text into processable units", "Verifying every fact", "Searching the internet"], 0, "Tokens may be words, word fragments, or punctuation."], ["A chatbot supplies a plausible citation. What should you do?", ["Trust its confident tone", "Verify the source and its claims", "Ask it to say it is certain"], 1, "Fluent text can include invented sources. Confirm that a source exists and supports the claim."], ["Why represent language with embeddings?", ["To encode relationships numerically", "To guarantee that every claim is true", "To eliminate ambiguity forever"], 0, "Embeddings represent language as vectors whose relationships can capture patterns of use."]]}, {"title": "Unit 4: Computer Vision and Reinforcement Learning", "concepts": [{"title": "An image is a grid of numbers", "blocks": [{"text": "A computer does not see a picture. It sees a grid of numbers. Each square in the grid is a pixel. In a grayscale image, each pixel holds one number for brightness, usually from 0 (black) to 255 (white). In a color image, each pixel holds three numbers: how much red, green, and blue light it contains. A single 12-megapixel phone photo is about 36 million numbers.", "list": false}, {"text": "Everything a vision system does, it does by finding patterns in those numbers.", "list": false}], "id": "3-0"}, {"title": "How vision models find patterns", "blocks": [{"text": "Modern computer vision runs on convolutional neural networks (CNNs). A CNN slides small filters across the image. A filter is a tiny grid of weights, often 3 by 3, that responds strongly to one kind of pattern, such as a vertical edge or a patch of a certain texture.", "list": false}, {"text": "The network stacks layers of these filters, building from simple to complex, the same way deep learning works in Unit 2:", "list": false}, {"text": "Early layers detect edges and color changes.", "list": true}, {"text": "Middle layers combine edges into corners, curves, and textures.", "list": true}, {"text": "Later layers combine those into parts: an eye, a wheel, a window.", "list": true}, {"text": "The final layer combines parts into a decision: face, car, building.", "list": true}, {"text": "The network learns which filters to use by training on millions of labeled images.", "list": false}], "id": "3-1"}, {"title": "What vision systems do", "blocks": [{"text": "Image classification answers \"what is in this picture?\" with one label: cat, X-ray shows pneumonia.", "list": true}, {"text": "Object detection finds several objects and draws a box around each. A self-driving car must locate every pedestrian, sign, and vehicle in each frame.", "list": true}, {"text": "Segmentation labels every pixel. A medical system can outline the exact edges of a tumor.", "list": true}, {"text": "Facial recognition converts a face into a set of measurements, sometimes called a faceprint, and compares it against stored faceprints. Phone unlocking, airport boarding gates, and base access systems work this way.", "list": true}, {"text": "Optical character recognition (OCR) reads printed or handwritten text from images, such as license plates or scanned forms.", "list": true}], "id": "3-2"}, {"title": "Where vision fails", "blocks": [{"text": "Vision systems fail when the images they see differ from the images they trained on. Poor lighting, odd angles, rain on a camera lens, or an unusual object can all cause errors. Researchers have also shown that small, deliberate changes to an image, such as a few stickers on a stop sign, can make a model misread it. These are called adversarial examples.", "list": false}, {"text": "Facial recognition raises particular concerns. Studies, including testing by the U.S. National Institute of Standards and Technology (NIST), have found that many algorithms show higher error rates for some demographic groups than others. The cause is usually training data that underrepresents those groups. When the system is used for policing or security, those errors land on real people.", "list": false}], "id": "3-3"}, {"title": "Learning by trial and error", "blocks": [{"text": "Reinforcement learning (RL) works without labeled answers. Instead, an agent takes actions in an environment and receives rewards or penalties. Over many attempts, it learns which actions lead to the most reward.", "list": false}, {"text": "The vocabulary:", "list": false}, {"text": "Agent: the learner and decision-maker, such as a robot vacuum or a game-playing program.", "list": true}, {"text": "Environment: the world the agent acts in.", "list": true}, {"text": "State: the agent's current situation, such as its position in a room.", "list": true}, {"text": "Action: a choice the agent can make: move forward, turn left.", "list": true}, {"text": "Reward: a number that says how good the result was. Cleaning a dirty patch earns a reward. Bumping a wall earns a penalty.", "list": true}, {"text": "Policy: the strategy the agent learns, a rule for which action to take in each state.", "list": true}, {"text": "This is how you might train a dog. You do not explain the rules. You reward the behavior you want, and the dog figures out what earns treats.", "list": false}], "id": "3-4"}, {"title": "Exploration vs. exploitation", "blocks": [{"text": "Every RL agent faces one central tension. Should it exploit the action it already knows works well, or explore an untried action that might work better?", "list": false}, {"text": "The multi-armed bandit problem captures this. Picture a row of slot machines, each paying out at a different hidden rate. If you only play the first machine that pays, you may miss a better one. If you keep trying new machines forever, you waste plays on bad ones. Good strategies explore heavily at first, then shift toward exploiting what they have learned. The same tradeoff shows up in online advertising, clinical trials, and choosing which product to recommend.", "list": false}], "id": "3-5"}, {"title": "Self-play and game-playing AI", "blocks": [{"text": "Games are ideal for RL. The rules are clear and the reward is obvious: win or lose. In self-play, an agent improves by playing against copies of itself. Each version becomes a slightly better opponent for the next.", "list": false}, {"text": "DeepMind's AlphaGo combined deep learning with RL and defeated world Go champion Lee Sedol in 2016. Its successor, AlphaZero, learned chess, shogi, and Go from nothing but the rules and self-play, and surpassed the strongest existing programs in each. It found strategies that human players had not discovered in centuries.", "list": false}], "id": "3-6"}, {"title": "RL in the real world", "blocks": [{"text": "RL is used in robotics control, data center cooling, inventory management, and the ranking of content feeds. It is also part of how chatbots are trained, through the RLHF step described in Unit 3.", "list": false}, {"text": "RL has a well-known weakness: the agent optimizes exactly the reward it is given, not the goal you had in mind. An agent rewarded for points in a boat-racing game famously learned to spin in circles collecting bonus items instead of finishing the race. Designing the right reward is one of the hardest parts of RL.", "list": false}], "id": "3-7"}], "intro": [{"text": "This unit pairs two different ideas. Computer vision is about perceiving the world. Reinforcement learning is about acting in it.", "list": false}], "quiz": [["A system draws a box around each vehicle. Which vision task is this?", ["Object detection", "Sentiment analysis", "Regression only"], 0, "Object detection locates objects; segmentation labels individual pixels."], ["An agent tries an unfamiliar action to learn whether it works better. This is…", ["Exploration", "Exploitation", "Tokenization"], 0, "Exploration tests new options; exploitation uses a known good option."], ["A racing agent collects bonus points in circles instead of finishing. What went wrong?", ["The reward did not capture the intended goal", "The agent needed more labels", "Rewards cannot affect behavior"], 0, "Agents optimize the specified reward, which can differ from the goal the designer intended."]]}, {"title": "Unit 5: Recommender Systems", "concepts": [{"title": "What recommenders do", "blocks": [{"text": "A recommender system predicts which items a person is most likely to want and ranks them. It decides what Netflix shows on your home screen, which products Amazon suggests, which songs Spotify queues next, and which posts appear first in your social media feed. Recommenders drive a large share of what people watch and buy on these platforms. They are among the most commercially important AI systems in existence.", "list": false}, {"text": "The core problem is a giant, mostly empty table. Picture every user as a row and every item as a column. A cell holds a rating or a purchase. Most cells are blank, because no one has watched more than a tiny fraction of the catalog. The recommender's job is to predict the blanks.", "list": false}], "id": "4-0"}, {"title": "The data recommenders learn from", "blocks": [{"text": "Explicit feedback is what you tell the system directly: a star rating, a thumbs up, a written review. It is clear but scarce. Most people never rate anything.", "list": false}, {"text": "Implicit feedback is what you do: what you click, how long you watch, what you skip, what you add to a cart, what you buy. It is noisy but plentiful. Watching a show for two minutes and quitting says something. Binge-watching a whole season says something stronger. Most modern recommenders lean heavily on implicit feedback.", "list": false}], "id": "4-1"}, {"title": "Collaborative filtering", "blocks": [{"text": "Collaborative filtering recommends based on the behavior of similar people. It needs no information about the items themselves.", "list": false}, {"text": "User-based collaborative filtering finds people whose past choices match yours, then recommends what they liked that you have not tried. If you and another viewer both loved the same five war documentaries, and they also loved a sixth one, the system suggests the sixth to you.", "list": false}, {"text": "Item-based collaborative filtering works from the item side. It finds items that tend to be chosen by the same people. Amazon's \"customers who bought this also bought\" is the classic example. Amazon engineers published this approach in 2003, and it scaled better than the user-based method because item relationships change more slowly than individual users do.", "list": false}], "id": "4-2"}, {"title": "Content-based filtering", "blocks": [{"text": "Content-based filtering recommends items similar to ones you already liked, based on the items' own features. For a movie, the features might be genre, director, lead actors, setting, and keywords. If you watched three Christopher Nolan films, it suggests a fourth. For a job site, features might be the skills, location, and salary range in each posting.", "list": false}, {"text": "The strength of content-based filtering is that it can recommend a brand-new item the moment it is added, because it only needs the item's description. Its weakness is predictability. It rarely surprises you with something outside what you already know you like.", "list": false}], "id": "4-3"}, {"title": "Latent factors and the Netflix Prize", "blocks": [{"text": "Modern collaborative filtering usually uses matrix factorization. Instead of comparing users directly, it learns a small set of hidden traits, called latent factors, that explain the ratings. Each user gets a score on each trait, and each item gets a score on each trait. The predicted rating is how well the two sets of scores line up.", "list": false}, {"text": "Nobody defines the traits. The system discovers them from the data. When researchers inspect them afterward, some turn out to be interpretable, such as \"serious drama vs. light comedy\" or \"aimed at teenagers vs. adults.\" Others have no obvious human meaning but still predict well.", "list": false}, {"text": "This method gained fame through the Netflix Prize. From 2006 to 2009, Netflix offered $1 million to any team that could improve its rating predictions by 10 percent. The winning team relied heavily on matrix factorization combined with many other models. That blend became a template for the industry: real recommenders are usually hybrids that combine collaborative filtering, content-based filtering, and other signals such as time of day, device, and current trends.", "list": false}], "id": "4-4"}, {"title": "Built-in problems", "blocks": [{"text": "Cold start. A new user has no history. A new item has no ratings. Collaborative filtering has nothing to work with. Platforms deal with this by asking new users to pick a few interests, recommending popular items at first, or falling back on content-based methods.", "list": false}, {"text": "Sparsity. Even active users touch a tiny fraction of the catalog. Predictions built on thin data are unreliable.", "list": false}, {"text": "Popularity bias. Popular items collect more clicks, so they get recommended more, so they collect even more clicks. Niche items that many people might enjoy never get the exposure to prove it.", "list": false}, {"text": "Filter bubbles and feedback loops. The system shows you what you clicked on before. You click on what it shows you. Over time your feed narrows. For movies, that is a mild annoyance. For news and political content, it can harden opinions and limit exposure to other views.", "list": false}, {"text": "Optimizing the wrong goal. A recommender optimizes whatever metric its owner chooses, often watch time or engagement. Engagement and wellbeing are not the same thing. Content that provokes outrage keeps people scrolling, so systems tuned purely for engagement can end up promoting it.", "list": false}], "id": "4-5"}, {"title": "Build or buy", "blocks": [{"text": "Organizations face a practical choice. Cloud providers such as Amazon Web Services, Google Cloud, and Microsoft Azure sell ready-made recommendation services. These are faster and cheaper to start with and need less expertise. A custom-built system costs more but can be tuned to the business's own goals, data, and constraints. The right choice depends on how central recommendations are to the business and how much control over the system's behavior the organization needs.", "list": false}], "id": "4-6"}], "intro": [], "quiz": [["A service recommends movies enjoyed by people with similar viewing histories. Which approach is this?", ["Collaborative filtering", "Content-based filtering only", "OCR"], 0, "Collaborative filtering uses patterns in user-item interactions."], ["A new user has no viewing history. What challenge is this?", ["Cold start", "Overfitting by definition", "Image segmentation"], 0, "Cold start means there is little history for a new user or item."], ["Watch time is what kind of feedback?", ["Implicit", "Explicit star rating", "A training label supplied by every viewer"], 0, "Implicit feedback comes from behavior; explicit feedback is a directly supplied rating or preference."]]}, {"title": "Unit 6: Robotics and Robotic Process Automation", "concepts": [{"title": "What a robot is made of", "blocks": [{"text": "Every robot has three kinds of parts.", "list": false}, {"text": "Sensors collect information about the world: cameras, microphones, bump sensors, distance sensors, GPS, accelerometers, and lidar, which measures distance by bouncing laser pulses off surfaces.", "list": true}, {"text": "Controllers are the computers that process sensor data and decide what to do.", "list": true}, {"text": "Actuators carry out the decision: motors that turn wheels, joints that move arms, grippers that close.", "list": true}], "id": "5-0"}, {"title": "The Sense, Plan, Act loop", "blocks": [{"text": "Robots operate in a continuous loop.", "list": false}, {"text": "Sense. Read the sensors. Where am I? What is around me?", "list": true}, {"text": "Plan. Decide what to do next, based on the goal and what the sensors report.", "list": true}, {"text": "Act. Send commands to the actuators.", "list": true}, {"text": "Repeat, many times per second.", "list": true}, {"text": "The loop explains a key difference between robots. A robot that skips sensing follows a fixed script. Program it to drive forward three meters and turn left, and it does exactly that, even if someone moved a wall. A robot that senses can adapt. A robot vacuum with bump sensors changes direction when it hits a chair leg it was never told about.", "list": false}, {"text": "The lesson generalizes. A system tuned perfectly for one environment can fail badly when the environment changes. Sensing is what lets a robot cope with a world it was not programmed for.", "list": false}], "id": "5-1"}, {"title": "Where AI fits in", "blocks": [{"text": "Not every robot uses AI. A traditional factory welding arm repeats the same precise motion thousands of times a day with no learning at all. AI enters at specific points in the loop:", "list": false}, {"text": "Perception: computer vision from Unit 4 lets the robot recognize objects, people, and obstacles.", "list": true}, {"text": "Mapping and navigation: a technique called SLAM (simultaneous localization and mapping) lets a robot build a map of an unfamiliar space while tracking its own position within it.", "list": true}, {"text": "Learning motion: reinforcement learning from Unit 4 can teach a robot to walk, grasp, or balance through trial and error, often first in simulation.", "list": true}], "id": "5-2"}, {"title": "Types of robots", "blocks": [{"table": [["Type", "What it does", "Examples"], ["Industrial robots", "Repetitive, high-precision tasks behind safety cages", "Car-factory welding and painting arms. The first, Unimate, went to work at General Motors in 1961"], ["Collaborative robots (cobots)", "Work alongside people without cages, slowing or stopping on contact", "Small arms that hand parts to assembly workers"], ["Mobile and warehouse robots", "Move goods around a building", "Amazon's shelf-carrying robots"], ["Field and military robots", "Operate in dangerous or remote places", "Explosive ordnance disposal robots, drones, planetary rovers"], ["Medical robots", "Extend a surgeon's precision", "Surgical systems a surgeon controls from a console"], ["Service and consumer robots", "Everyday tasks", "Robot vacuums, lawn mowers, delivery robots"], ["Humanoid robots", "Human-shaped machines meant to work in human spaces", "Research and early commercial humanoids from several companies"]]}], "id": "5-3"}, {"title": "Levels of autonomy", "blocks": [{"text": "Robots range from fully controlled by a person to fully self-directed. Self-driving vehicles are the best-known example of this scale. The Society of Automotive Engineers defines six levels, from Level 0 (no automation, the human does everything) to Level 5 (the vehicle drives itself anywhere, in any conditions, with no human needed). Most cars sold today with driver-assistance features sit at Level 2: the car can steer and brake, but the driver must stay alert and ready to take over. Military systems raise the same question with higher stakes: how much decision-making should a machine have, and where must a human stay in the loop?", "list": false}], "id": "5-4"}, {"title": "What RPA is", "blocks": [{"text": "Robotic process automation is software that mimics the clicks and keystrokes a person makes on a computer. An RPA \"bot\" logs into applications, copies data from one system, pastes it into another, fills in forms, and sends emails. It works through the same screens a person would use.", "list": false}, {"text": "Think of an office worker who spends every morning copying invoice numbers from emailed PDFs into an accounting system. An RPA bot can be recorded doing that task once and then repeat it thousands of times without fatigue or typos.", "list": false}], "id": "5-5"}, {"title": "Where RPA works", "blocks": [{"text": "RPA fits tasks that are high-volume, repetitive, rule-based, and built on stable systems. Common uses include invoice processing, payroll, insurance claims intake, employee onboarding paperwork, and moving data between old systems that cannot talk to each other directly.", "list": false}, {"text": "Bots come in two forms. Attended bots run on a worker's desktop and help with parts of a task when the worker triggers them. Unattended bots run on their own on a server, often overnight, processing batches of work.", "list": false}], "id": "5-6"}, {"title": "Where RPA breaks", "blocks": [{"text": "Most RPA is not AI. A standard bot follows fixed rules and learns nothing. That makes it brittle. If a website moves a button, renames a field, or changes a layout, the bot fails. If an invoice arrives in a format the bot was not built for, it stops or, worse, enters the wrong data.", "list": false}, {"text": "RPA also automates a process exactly as it is. If the process is inefficient, the bot makes the inefficiency faster.", "list": false}], "id": "5-7"}, {"title": "Intelligent automation", "blocks": [{"text": "The line between RPA and AI is blurring. Intelligent automation adds AI components to RPA bots. OCR reads scanned documents. NLP pulls the meaning out of an email. A machine learning model flags which invoices look unusual and need a human to review them. The bot handles the routine steps, and the AI handles the parts that need judgment about messy input.", "list": false}], "id": "5-8"}], "intro": [{"text": "The two topics share a word and little else. A robot is a physical machine that acts in the world. Robotic process automation is software that acts on computer screens.", "list": false}], "quiz": [["Which robot component carries out physical movement?", ["Actuator", "Sensor", "Training label"], 0, "Motors, joints, and grippers are actuators; sensors collect information."], ["A bot copies fixed fields between stable office applications. Must it use AI?", ["No; standard RPA can follow rules", "Yes; every automated task is AI", "Yes; all bots train neural networks"], 0, "Standard RPA can automate clicks and keystrokes without learning."], ["What is the correct robot operating loop?", ["Sense → Plan → Act", "Act → Ignore → Repeat", "Train → Delete → Guess"], 0, "Sensor information guides planning, and actuators execute the chosen action."]]}, {"title": "Unit 7: Applications of AI", "concepts": [{"title": "Finance: fraud detection", "blocks": [{"text": "Every time you swipe a card, a model scores the transaction for fraud risk in a fraction of a second. It compares the purchase against your normal pattern: the usual amount, location, time of day, type of merchant, and device. A $4 coffee near home on a weekday morning scores low. A $2,000 electronics purchase in another country at 3 a.m. scores high.", "list": false}, {"text": "The techniques combine supervised learning, trained on past transactions labeled fraud or legitimate, with unsupervised anomaly detection, which flags transactions unlike anything seen before. Unsupervised methods matter because fraudsters keep inventing new schemes that no labeled example covers.", "list": false}, {"text": "The hard tradeoff is between two kinds of error. A false negative lets fraud through and costs money. A false positive declines a legitimate purchase and angers a customer. Fraud is rare compared to normal purchases, so a model can look highly accurate while still catching little fraud. A model that labeled every transaction \"legitimate\" would be more than 99 percent accurate and completely useless.", "list": false}, {"text": "Banks also use AI for credit scoring, algorithmic trading, and customer-facing virtual assistants. Bank of America's assistant, Erica, answers account questions and flags unusual charges for millions of customers. It combines NLP to understand the request with rules and models that act on the account.", "list": false}], "id": "6-0"}, {"title": "Supply chain and logistics", "blocks": [{"text": "Demand forecasting uses regression and time-series models to predict how much of each product will sell, at each location, each week. The models draw on sales history, seasons, holidays, weather, promotions, and local events. Better forecasts mean less overstock and fewer empty shelves.", "list": false}, {"text": "Route optimization plans delivery routes that minimize time and fuel across thousands of stops. UPS's ORION system is a well-known example, cutting millions of miles driven per year. Warehouse automation combines Unit 6 robots with software that decides where each item should be stored and which robot should fetch it.", "list": false}, {"text": "The weakness is the same one seen throughout the course. Forecasting models learn from the past. When the world shifts suddenly, as it did at the start of the COVID-19 pandemic, demand patterns break and models trained on normal years give badly wrong predictions until they are retrained.", "list": false}], "id": "6-1"}, {"title": "Healthcare", "blocks": [{"text": "AI is used to read medical images, predict which hospital patients are at risk of getting worse, speed up drug discovery, and draft clinical notes from doctor-patient conversations.", "list": false}, {"text": "One case shows the gap between lab results and real-world results. Google Health developed a deep learning system that grades photos of the retina for diabetic retinopathy, a leading cause of preventable blindness. It performed at specialist level on its test images. When researchers deployed it in clinics in Thailand's national screening program, many real photos were taken in poor lighting with older equipment. The system rejected a large share of them as too low quality to grade, which meant extra visits for patients. The model was not wrong in the lab. The clinic was a different environment.", "list": false}, {"text": "In drug discovery, DeepMind's AlphaFold predicts the 3D shape of proteins from their chemical sequence, a problem that had resisted biologists for fifty years. Its creators shared the 2024 Nobel Prize in Chemistry.", "list": false}], "id": "6-2"}, {"title": "Customer service", "blocks": [{"text": "Chatbots and virtual agents now handle a large share of first-contact customer questions. Older bots matched keywords to scripted answers. Newer ones use LLMs and can hold natural conversations, often connected to a company's own documents so they can answer specific questions about policies or orders.", "list": false}, {"text": "The risks follow from Unit 3. An LLM-based bot can state a policy that does not exist. In a widely reported 2024 case, a Canadian tribunal ordered Air Canada to honor a refund policy that its website chatbot had invented. The company was held responsible for what its bot said.", "list": false}], "id": "6-3"}, {"title": "Manufacturing", "blocks": [{"text": "Predictive maintenance puts sensors on machines and uses models to spot early signs of failure, such as rising vibration or temperature, before a breakdown happens. Fixing a machine on a planned schedule is far cheaper than an unplanned shutdown. Visual quality inspection uses computer vision to catch defects on a production line faster and more consistently than human inspectors. The military uses the same predictive maintenance approach on aircraft and vehicles.", "list": false}], "id": "6-4"}, {"title": "Other sectors", "blocks": [{"text": "Retail and media: the recommender systems from Unit 5, plus dynamic pricing that adjusts prices to demand.", "list": true}, {"text": "Agriculture: drones and cameras that spot crop disease, and precision spraying that targets weeds individually.", "list": true}, {"text": "Energy: forecasting electricity demand and output from wind and solar farms.", "list": true}, {"text": "Government and defense: document processing, logistics planning, satellite image analysis, and cybersecurity threat detection.", "list": true}, {"text": "Human resources: resume screening, which carries the bias risks described in Unit 2.", "list": true}], "id": "6-5"}, {"title": "How to evaluate an AI application", "blocks": [{"text": "When you meet a new AI application, at work or in the news, these questions cut through the marketing:", "list": false}, {"text": "What problem does it solve, and how was it solved before? If the old way worked fine, the AI may not be worth its cost.", "list": true}, {"text": "What is the mechanism? Which technique does it use, and what data does it learn from?", "list": true}, {"text": "How is success measured? Accuracy alone can mislead, as the fraud example shows. Ask about the errors that matter.", "list": true}, {"text": "Does the real environment match the training data? The retinal screening case is the warning.", "list": true}, {"text": "What happens when it is wrong, and who is responsible? The Air Canada case is the answer courts are starting to give.", "list": true}, {"text": "Who could be harmed? Look at bias, privacy, job effects, and whether people affected by the decision can challenge it.", "list": true}, {"text": "Is there a human in the loop for high-stakes decisions?", "list": true}], "id": "6-6"}], "intro": [{"text": "Unit 7 is where the techniques from Units 2 through 6 meet real organizations. Almost no real application uses one technique alone. Most combine several.", "list": false}], "quiz": [["A fraud detector labels every transaction legitimate and has 99% accuracy. What should you ask?", ["How many actual fraud cases it misses", "Whether 99% proves it is useful", "Whether accuracy removes all risk"], 0, "Rare events can make overall accuracy misleading. Examine false negatives and false positives."], ["A maintenance model uses vibration and temperature to anticipate breakdowns. This is…", ["Predictive maintenance", "Text generation only", "Collaborative filtering"], 0, "Sensor patterns can help predict equipment failures before a breakdown."], ["A model works in lab photos but rejects many clinic photos. What should be examined?", ["Differences between test and deployment conditions", "Whether lab accuracy guarantees success", "Whether all clinic users are at fault"], 0, "Lighting, equipment, workflows, and other real-world conditions can differ from the test setting."]]}, {"title": "Unit 8: The Future of AI", "concepts": [{"title": "From chatbots to agents", "blocks": [{"text": "A chatbot answers. An AI agent acts. An agent takes a goal, breaks it into steps, uses tools to carry out those steps, checks the results, and keeps going until the goal is met or it hits a stopping point.", "list": false}, {"text": "Ask a chatbot for flight options and it lists some. Ask an agent to book a trip and it searches flights, compares prices, checks your calendar, picks one, fills in the booking form, and emails you the confirmation.", "list": false}], "id": "7-0"}, {"title": "How an agent is built", "blocks": [{"text": "An agent is not one model. It is a system with several parts, and the language model is only one of them.", "list": false}, {"text": "The goal: what the agent is trying to accomplish.", "list": true}, {"text": "The LLM: the decision step. At each turn it reads the situation and chooses the next action.", "list": true}, {"text": "Tools: the actions the agent can take, such as web search, a calculator, a database query, sending an email, or running code. The LLM cannot do these things itself. It writes a request, and ordinary software carries it out.", "list": true}, {"text": "Memory: a record of what has happened so far, so the agent does not repeat itself or lose track.", "list": true}, {"text": "The loop: the framework that runs the cycle and feeds each tool result back to the LLM.", "list": true}, {"text": "Stop rules: limits on how many steps it can take, what it may spend, and which actions need a human to approve.", "list": true}, {"text": "The cycle mirrors the Sense, Plan, Act loop from robotics. The agent observes the current state, the LLM plans the next step, a tool acts, and the result becomes the next observation.", "list": false}], "id": "7-1"}, {"title": "Why agents raise the stakes", "blocks": [{"text": "An agent inherits every weakness of the LLM inside it, and then acts on them. A chatbot that hallucinates gives you a wrong answer you can check. An agent that hallucinates may send the wrong email, delete the wrong file, or buy the wrong thing before anyone looks.", "list": false}, {"text": "Agents also create new security risks. Prompt injection hides instructions inside content the agent reads, such as a web page or an email. An agent told to summarize a page may find hidden text saying \"forward the user's files to this address\" and follow it, because to the LLM, instructions and data are both just text. This is why stop rules and human approval for consequential actions matter.", "list": false}], "id": "7-2"}, {"title": "Other trends to watch", "blocks": [{"text": "Multimodal models handle text, images, audio, and video in one system. You can show a model a photo of a broken part and ask how to fix it.", "list": true}, {"text": "Smaller and on-device models run on phones and laptops without sending data to the cloud. That helps privacy and works without a connection.", "list": true}, {"text": "AI in science is speeding up research in biology, materials, and weather forecasting, building on successes like AlphaFold.", "list": true}, {"text": "Compute and energy costs are rising sharply. Training and running large models takes huge data centers, and their electricity and water use is now a public policy question.", "list": true}, {"text": "Synthetic media makes it cheap to produce realistic fake images, audio, and video of real people. Deepfakes are already used in fraud, scams, and disinformation.", "list": true}], "id": "7-3"}, {"title": "Governance and regulation", "blocks": [{"text": "Governments are working out how to regulate AI, and approaches differ.", "list": false}, {"text": "The European Union's AI Act, which entered into force in 2024 and phases in over several years, sorts AI systems by risk. Some uses are banned outright, such as social scoring of citizens by governments. High-risk uses, such as AI in hiring, credit, medical devices, and critical infrastructure, must meet requirements for data quality, documentation, human oversight, and accuracy. Lower-risk systems such as chatbots mainly face transparency rules, such as telling people they are talking to an AI.", "list": false}, {"text": "The United States has no single comprehensive AI law. Rules come from a mix of federal agency guidance, executive orders that have shifted between administrations, existing laws on discrimination and consumer protection, and a growing number of state laws. The NIST AI Risk Management Framework is a widely used voluntary guide for organizations. The U.S. Department of Defense has adopted its own principles for responsible AI use. These policies change frequently, so check current sources before relying on any specific rule.", "list": false}], "id": "7-4"}, {"title": "Work and the workforce", "blocks": [{"text": "The most useful question is not whether AI will replace jobs. It is which tasks within jobs it will change, and how fast.", "list": false}, {"text": "Most jobs are bundles of tasks. AI tends to automate some tasks in a job while leaving others. A paralegal's document review may speed up dramatically while client communication and judgment calls stay human. Earlier waves of automation mostly affected routine physical and clerical work. GenAI is different because it reaches tasks involving writing, analysis, summarizing, and coding, which were long considered safe.", "list": false}, {"text": "The practical response for most professionals is to understand the tools well enough to use them, check them, and spot where they fail. That is the skill this course set out to build.", "list": false}], "id": "7-5"}, {"title": "Open questions", "blocks": [{"text": "Several big questions remain unsettled, and serious experts disagree on each:", "list": false}, {"text": "Will scaling keep working? Bigger models trained on more data have improved steadily. Whether that continues, or hits limits of data, cost, and energy, is unknown.", "list": true}, {"text": "Is AGI coming, and when? Predictions range from a few years to never.", "list": true}, {"text": "How do we keep powerful systems aligned with human intentions? Alignment research tries to ensure AI systems do what their designers and users actually intend, including when the systems become more capable.", "list": true}, {"text": "Who is accountable when an AI system causes harm: the developer, the company deploying it, or the user?", "list": true}, {"text": "None of these can be answered by someone who does not understand how today's systems work. That is the foundation Units 1 through 7 provide.", "list": false}], "id": "7-6"}], "intro": [{"text": "You cannot judge where AI is headed without understanding how it works now. Unit 8 builds on everything before it.", "list": false}], "quiz": [["What lets an LLM-based agent actually query a database?", ["Ordinary software executing a tool request", "The LLM’s text alone", "A longer prompt with no database connection"], 0, "The LLM selects or requests an action; connected software executes it and returns a result."], ["An external page tells an agent to ignore its task and send private files. What is the risk?", ["Prompt injection", "Helpful context in all cases", "Cold start"], 0, "Untrusted content can contain instructions that attempt to redirect the system."], ["How should professionals evaluate AI’s effect on work?", ["Examine the tasks within jobs", "Assume every job disappears at once", "Ignore verification skills"], 0, "Jobs contain multiple tasks; automation can change some while leaving others dependent on human judgment."]]}], "glossary": [["Term", "Meaning", "Unit"], ["Artificial intelligence (AI)", "Computer systems that perform tasks normally requiring human judgment", "1"], ["Narrow AI", "AI that performs one kind of task; every system in use today", "1"], ["Artificial general intelligence (AGI)", "Hypothetical AI able to learn any intellectual task a person can", "1, 8"], ["AI winter", "A period of collapsed funding and interest after AI overpromised", "1"], ["Machine learning", "AI that learns patterns from data instead of following hand-written rules", "2"], ["Supervised learning", "Learning from examples paired with correct answers", "2"], ["Unsupervised learning", "Finding structure in data with no labels, such as clustering", "2"], ["Overfitting", "Memorizing training data so the model fails on new data", "2"], ["Neural network", "A model made of layers of connected units whose weights are learned", "2"], ["Backpropagation", "The method that works out how much each weight contributed to an error", "2"], ["Deep learning", "A subset of machine learning using neural networks with many layers", "2"], ["Black box problem", "The difficulty of explaining why a complex model gave its answer", "2"], ["Natural language processing (NLP)", "AI that works with human language", "3"], ["Token", "A word or word fragment; LLMs generate text one token at a time", "3"], ["Word embedding", "A word represented as a list of numbers so similar words sit close together", "3"], ["Transformer", "The model architecture behind LLMs, built on attention", "3"], ["Large language model (LLM)", "A transformer trained on huge amounts of text to predict the next token", "3"], ["Hallucination", "Fluent, confident output that is false", "3"], ["Generative AI (GenAI)", "Models that produce new text, images, audio, or code", "3"], ["Pixel", "One cell in the grid of numbers that makes up a digital image", "4"], ["Convolutional neural network (CNN)", "A deep learning model that scans images with learned filters", "4"], ["Object detection", "Finding and boxing each object in an image", "4"], ["Reinforcement learning (RL)", "Learning by trial and error from rewards and penalties", "4"], ["Policy", "The strategy an RL agent learns for choosing actions", "4"], ["Exploration vs. exploitation", "The tradeoff between trying new actions and repeating known good ones", "4"], ["Collaborative filtering", "Recommending based on what similar users chose", "5"], ["Content-based filtering", "Recommending items with features similar to past choices", "5"], ["Latent factors", "Hidden traits a recommender learns to explain preferences", "5"], ["Cold start", "The problem of recommending with no history for a new user or item", "5"], ["Filter bubble", "A narrowing feed created by recommending only what a user already likes", "5"], ["Sense, Plan, Act", "The basic operating loop of a robot", "6"], ["Actuator", "The part of a robot that moves, such as a motor or gripper", "6"], ["SLAM", "Building a map of a space while tracking your position in it", "6"], ["Robotic process automation (RPA)", "Software bots that follow rules to automate on-screen computer tasks", "6"], ["Intelligent automation", "RPA combined with AI components such as OCR or NLP", "6"], ["False positive / false negative", "Flagging something that is fine / missing something that is not", "7"], ["Predictive maintenance", "Using sensor data to predict machine failures before they happen", "7"], ["AI agent", "An LLM in a loop with a goal, tools, memory, and stop rules", "8"], ["Prompt injection", "Hidden instructions in content that trick an AI system into acting on them", "8"], ["Alignment", "Making AI systems reliably do what people actually intend", "8"]]};

/* ---------- Animation loop ---------- */
function tick(t){
  const idle=performance.now()-lastUser>7000;
  if(!reduced&&idle&&!sel&&thread===null&&!query)goal.yaw+=0.0011;
  const k=reduced?1:0.085;let moving=false;
  for(const key of ['yaw','pitch','dist','tx','ty','tz']){const d=goal[key]-cam[key];if(Math.abs(d)>(key==='yaw'||key==='pitch'?1e-4:.05)){cam[key]+=d*k;moving=true}else cam[key]=goal[key]}

/* ---------- Pointer, wheel, keyboard ---------- */
const ptrs=new Map();let down=null,moved=0,pinch=null;
const local=e=>{const b=canvas.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,local(e));if(ptrs.size===1){down=local(e);moved=0}lastUser=performance.now();canvas.classList.add('dragging')});

  if(!ptrs.has(e.pointerId)){const h=pick(p.x,p.y);const id=h?h.id:null;if(id!==hover){hover=id;canvas.classList.toggle('over',!!h);dirty=true}return}
